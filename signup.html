<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1" />
		<title>Sign Up || Handy Expense Tracker</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
			crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" />
		<link
			rel="stylesheet"
			href="CSS/dashboard.css" />
		<style>
			body {
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				padding: 20px;
			}
			.auth-card {
				width: 100%;
				max-width: 450px;
				background-color: #2a2a2a;
				border: 1px solid #444;
				border-radius: 12px;
				padding: 2.5rem;
				box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
			}
			.auth-logo {
				color: #00bfff;
				font-size: 2.5rem;
				margin-bottom: 1.5rem;
				text-align: center;
			}
			.auth-title {
				font-weight: 600;
				margin-bottom: 2rem;
				text-align: center;
				color: #e0e0e0;
			}
		</style>
	</head>

	<body>
		<div class="auth-card">
			<div class="auth-logo">
				<i class="bi bi-wallet2"></i>
			</div>
			<h3 class="auth-title">Create an Account</h3>
			
			<form action="signin.html">
				<div class="mb-3">
					<label for="fullName" class="form-label">Full Name</label>
					<div class="input-group">
						<span class="input-group-text bg-dark border-secondary text-muted">
							<i class="bi bi-person"></i>
						</span>
						<input type="text" class="form-control" id="fullName" placeholder="John Doe" required>
					</div>
				</div>
				<div class="mb-3">
					<label for="email" class="form-label">Email Address</label>
					<div class="input-group">
						<span class="input-group-text bg-dark border-secondary text-muted">
							<i class="bi bi-envelope"></i>
						</span>
						<input type="email" class="form-control" id="email" placeholder="name@example.com" required>
					</div>
				</div>
				<div class="row">
					<div class="col-md-6 mb-3">
						<label for="password" class="form-label">Password</label>
						<div class="input-group">
							<span class="input-group-text bg-dark border-secondary text-muted">
								<i class="bi bi-lock"></i>
							</span>
							<input type="password" class="form-control" id="password" placeholder="Password" required>
						</div>
					</div>
					<div class="col-md-6 mb-4">
						<label for="confirmPassword" class="form-label">Confirm</label>
						<div class="input-group">
							<span class="input-group-text bg-dark border-secondary text-muted">
								<i class="bi bi-shield-lock"></i>
							</span>
							<input type="password" class="form-control" id="confirmPassword" placeholder="Confirm" required>
						</div>
					</div>
				</div>
				<div class="d-grid gap-2">
					<button type="submit" class="btn btn-info text-white fw-bold py-2">
						Create Account
					</button>
				</div>
			</form>
			
			<div class="mt-4 text-center">
				<p class="text-muted mb-0">Already have an account? <a href="signin.html" class="text-info text-decoration-none">Sign In</a></p>
			</div>
		</div>

		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
			crossorigin="anonymous"></script>
	</body>
</html>
